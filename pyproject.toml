# Libraries required to run `harnice -b`. packaging/export_cli_tree.py copies
# this file into the public harnice-cli repo. The console is a separate
# project: serve_console/pyproject.toml.

[project]
name = "harnice"
dynamic = ["version"]
authors = [
  { name="Kenyon Shutt", email="harnice.io@gmail.com" },
]
description = "Electrical System CAD"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pillow",
    "pypdf",
    "xlwt",
    "webcolors",
    "prompt_toolkit",
    "PyYAML",
    "colorama>=0.4.6",
    # Default system builds draw the physical model, and reading a STEP file
    # needs OpenCascade. Writing a faceted STEP file still has a fallback.
    "cadquery-ocp>=7.8.1.1,<8",
]

[project.urls]
Documentation = "https://harnice.io/"
Homepage = "https://github.com/harnice/Harnice"
Issues = "https://github.com/harnice/Harnice/issues"

[project.scripts]
harnice = "harnice.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["harnice*"]
exclude = ["harnice.gui*", "harnice.docs*"]
namespaces = true

[tool.setuptools.package-data]
harnice = ["defaults/**/*", "docs/**/*"]

[tool.setuptools.exclude-package-data]
# defaults/**/* also matches bytecode and Finder junk sitting in a local checkout.
harnice = ["*.pyc", "*.pyo", "*__pycache__*", "*.DS_Store"]

[tool.setuptools_scm]
# version derived from git tags (e.g. v0.3.3 → 0.3.3)
# Drop the +g<hash> local suffix. PyPI rejects it.
local_scheme = "no-local-version"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"
